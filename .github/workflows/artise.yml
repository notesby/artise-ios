#
# Artise's CI. There is no Mac in the team, so this workflow is the Mac:
# - checks: Artise file headers and script tests (Linux, fast).
# - stack: skips a branch's macOS tests when another open pull request is built on it (that one tests both).
# - tests: upstream SwiftFormat lint and unit tests, plus the Artise package tests. development runs every suite with
#   retries; other branches run Artise's suites and the changed files' suites once.
# - testflight (on demand): archives, signs with Artise's distribution certificate and uploads to TestFlight.
# - beta (on demand): puts a build in the public TestFlight group "Artise beta" and sends it to Beta App Review.
# Upstream's own workflows are disabled on this repository.

name: Artise

on:
  push:
    branches: [development, "feature/**", "fix/**", "ci/**"]
  workflow_dispatch:
    inputs:
      beta:
        description: "Also put the new build in the public beta (Artise beta)"
        type: boolean
        default: false
      beta_build:
        description: "Only put this existing build number in the public beta (no new build)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # One run per branch and trigger: a newer push cancels the older push run, but never a TestFlight build.
  group: artise-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Artise file headers
        run: Artise/Scripts/check-headers.sh

      - name: Artise script tests
        run: python3 -m unittest discover -s Artise/Scripts/tests -v

  # Stacked pull requests: a branch with another open pull request built on it is tested by that one, which
  # contains it, so its own macOS run is skipped. Rebase the branches above after changing one below.
  stack:
    name: Stack
    if: github.event_name == 'push' && github.ref != 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      covered: ${{ steps.above.outputs.covered }}
    steps:
      - name: Look for pull requests built on this branch
        id: above
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          above="$(gh pr list -R "$GITHUB_REPOSITORY" --state open --base "$GITHUB_REF_NAME" --json number -q 'map("#\(.number)") | join(", ")')"
          if [ -n "$above" ]; then
            echo "covered=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tested above::$above builds on this branch and runs the tests for both."
          else
            echo "covered=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: stack
    # Runs when the stack check was skipped (development, a manual run) or failed; skips a branch tested above.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.beta_build == '') && needs.stack.outputs.covered != 'true' }}
    runs-on: macos-26
    # A run without the compilation cache builds everything from scratch.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        run: source ci_scripts/ci_common.sh && setup_github_actions_environment

      # Homebrew installs the newest SwiftFormat, whose new rules flag upstream's own code. Use the version upstream
      # is formatted with; bump it when an upstream merge reformats the code.
      - name: Pin SwiftFormat
        run: |
          zip="$RUNNER_TEMP/swiftformat.zip"
          curl -fsSL -o "$zip" https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip
          echo "385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb  $zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/swiftformat"
          unzip -q -o "$zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version

      # Our repository holds only LFS pointers. The sample media the unit tests load comes from upstream's LFS.
      - name: Fetch upstream test media
        run: |
          git lfs install --local
          git config lfs.url https://github.com/element-hq/element-x-ios.git/info/lfs
          git lfs pull --include "Components/DevelopmentAssets/Media/**"
          if grep -rl "git-lfs.github.com/spec" Components/DevelopmentAssets/Media; then
            echo "::error title=Test media::Some files are still LFS pointers."
            exit 1
          fi

      - name: Restore compilation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/CompilationCache.noindex
          key: compilation-cache-unit-tests-${{ github.sha }}
          restore-keys: compilation-cache-unit-tests-

      - name: Generate the Xcode project
        run: xcodegen

      # The committed project, Info.plists and entitlements must match project.yml/app.yml. When they
      # don't, the regenerated files are uploaded so they can be committed from a machine without Xcode.
      - name: Check the committed generated files
        id: project
        run: |
          changed="$(git status --porcelain --untracked-files=no | cut -c4-)"
          if [ -z "$changed" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "$changed"
            echo "::warning title=Stale generated files::Commit the regenerated files from this run's xcodegen artifact."
            echo "$changed" > "$RUNNER_TEMP/xcodegen-files.txt"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the regenerated files
        if: steps.project.outputs.stale == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/xcodegen"
          tar -cf - -T "$RUNNER_TEMP/xcodegen-files.txt" | tar -xf - -C "$RUNNER_TEMP/xcodegen"

      - name: Upload the regenerated files
        if: steps.project.outputs.stale == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodegen
          path: ${{ runner.temp }}/xcodegen
          retention-days: 3
          if-no-files-found: ignore

      - name: Artise package tests
        run: swift test --package-path Artise

      - name: Upstream lint and unit tests
        # Preview snapshots are skipped: Artise's branding changes them on purpose. development runs every suite and
        # retries failed tests (upstream has flaky ones). Other branches run each test once, and only the suites that
        # test Artise's code and the files the branch changes (Artise/Scripts/artise_test_suites.py): about a minute
        # of tests instead of 11 to 13 a pass, and a real failure shows in one pass instead of four.
        run: |
          # A manual run (the TestFlight one) runs the full suite too, so any branch can get a full check.
          if [ "$GITHUB_REF" = "refs/heads/development" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            swift run -q tools ci unit-tests --skip-previews --retries 3
            exit
          fi
          git fetch -q --depth=1 origin development
          set -- --skip-previews --retries 0
          for suite in $(python3 Artise/Scripts/artise_test_suites.py $(git diff --name-only origin/development HEAD)); do
            set -- "$@" --only-testing "$suite"
          done
          echo "Suites: $*"
          swift run -q tools ci unit-tests "$@"

      - name: Save compilation cache
        # Like upstream: one branch fills the cache and every run reads it.
        if: ${{ !cancelled() && github.ref == 'refs/heads/development' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/CompilationCache.noindex
          key: compilation-cache-unit-tests-${{ github.sha }}

      - name: Archive test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Results
          path: test_output/UnitTests.zip
          retention-days: 3
          if-no-files-found: ignore

  testflight:
    name: TestFlight
    # On demand, for the branch to try on a phone: gh workflow run artise.yml --ref <branch>
    if: github.event_name == 'workflow_dispatch' && inputs.beta_build == ''
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      PROFILE_APP: ${{ secrets.PROFILE_APP }}
      PROFILE_NSE: ${{ secrets.PROFILE_NSE }}
      PROFILE_SHARE: ${{ secrets.PROFILE_SHARE }}
      PROFILE_STICKER: ${{ secrets.PROFILE_STICKER }}
    steps:
      - name: Check signing secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_CERT_P12 DIST_CERT_PASSWORD PROFILE_APP PROFILE_NSE PROFILE_SHARE PROFILE_STICKER; do
            if [ -z "${!name}" ]; then
              echo "::error title=TestFlight::The repository secret $name is missing (see Artise/README.md)."
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        run: source ci_scripts/ci_common.sh && setup_github_actions_environment

      # Firebase's file for usage statistics goes into the build here and never into git (as on Android).
      # Without it, analytics stay off and consent isn't asked.
      - name: Add the Firebase file
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            mkdir -p Artise/Resources/Firebase
            python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["GOOGLE_SERVICE_INFO_PLIST"].strip()))' > Artise/Resources/Firebase/GoogleService-Info.plist
            echo "Firebase file added."
          else
            echo "::warning title=Analytics::No GOOGLE_SERVICE_INFO_PLIST secret: analytics are off in this build."
          fi

      - name: Generate the Xcode project
        run: xcodegen

      # The build's service keys go in here and never into git: MapTiler's key (without it, location sharing stays
      # off), and Artise's crash reports (Sentry, crashes.artise.co) and bug reports (rageshake, reports.artise.co).
      # Crash reports are sent only after "Help improve Artise" is accepted. Element's Rust SDK Sentry and PostHog
      # stay off.
      - name: Set the build's service keys
        env:
          MAPLIBRE_API_KEY: ${{ secrets.MAPLIBRE_API_KEY }}
          SENTRY_DSN_IOS: ${{ secrets.SENTRY_DSN_IOS }}
          RAGESHAKE_URL: ${{ secrets.RAGESHAKE_URL }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path("Components/Secrets/Secrets.swift")
          def secret(name):
              value = os.environ.get(name, "").strip()
              return json.dumps(value) if value else "nil"
          key = os.environ.get("MAPLIBRE_API_KEY", "").strip()
          values = {"mapLibreAPIKey": secret("MAPLIBRE_API_KEY"),
                    "sentryDSN": secret("SENTRY_DSN_IOS"), "sentryRustDSN": "nil", "rageshakeURL": secret("RAGESHAKE_URL"),
                    "postHogHost": "nil", "postHogAPIKey": "nil"}
          lines = []
          for line in path.read_text().splitlines():
              match = re.match(r"\s*static let (\w+): String\? = ", line)
              if match and match.group(1) in values:
                  line = f"    static let {match.group(1)}: String? = {values[match.group(1)]}"
              lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          print("MapTiler key added." if key else "::warning title=Maps::No MAPLIBRE_API_KEY secret: location sharing is off in this build.")
          for name, what in (("SENTRY_DSN_IOS", "Crash reports"), ("RAGESHAKE_URL", "Bug reports")):
              print(f"{what} are on." if os.environ.get(name, "").strip() else f"::warning title={what}::No {name} secret: {what.lower()} are off in this build.")
          PY

      # Signing is manual: Artise's distribution certificate and App Store profiles, made with the
      # App Store Connect API (Xcode's automatic provisioning fails with API keys for this team).
      - name: Install the signing certificate and profiles
        run: |
          set -euo pipefail
          decode() { python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ[sys.argv[1]].strip()))' "$1"; }

          keychain="$RUNNER_TEMP/artise.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          decode DIST_CERT_P12 > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "ARTISE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$folder"
            for profile in PROFILE_APP PROFILE_NSE PROFILE_SHARE PROFILE_STICKER; do
              decode "$profile" > "$folder/$profile.mobileprovision"
            done
          done

          key_path="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$(dirname "$key_path")"
          decode ASC_KEY_P8 > "$key_path"
          chmod 600 "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "::error title=App Store Connect key::ASC_KEY_P8 isn't a base64-encoded .p8 key."
            exit 1
          fi
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # App Store builds use production push; the committed entitlements say development for local builds.
      - name: Use production push for this build
        run: plutil -replace aps-environment -string production ElementX/SupportingFiles/ElementX.entitlements

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Artise.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $ARTISE_KEYCHAIN" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*[Ss]ign|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Export the app
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Artise.xcarchive" \
            -exportOptionsPlist Artise/CI/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            | tee "$RUNNER_TEMP/export.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          # altool finds the key in a private_keys folder next to where it runs.
          cd "$RUNNER_TEMP"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice title=TestFlight::Build $GITHUB_RUN_NUMBER from ${GITHUB_REF_NAME} was uploaded. It shows in TestFlight after Apple finishes processing it."

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Remove the signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys"
          [ -n "${ARTISE_KEYCHAIN:-}" ] && security delete-keychain "$ARTISE_KEYCHAIN" || true

  beta:
    name: Public beta
    # gh workflow run artise.yml --ref <branch> -f beta=true          (a new build, then the beta)
    # gh workflow run artise.yml --ref <branch> -f beta_build=<number> (a build already in TestFlight)
    # Run it again after Beta App Review approves the first build: that's when the public link can be turned on.
    needs: testflight
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (inputs.beta_build != '' || (inputs.beta && needs.testflight.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BETA_BUILD: ${{ inputs.beta_build || github.run_number }}
      BETA_CONTACT_FIRST_NAME: ${{ secrets.BETA_CONTACT_FIRST_NAME }}
      BETA_CONTACT_LAST_NAME: ${{ secrets.BETA_CONTACT_LAST_NAME }}
      BETA_CONTACT_PHONE: ${{ secrets.BETA_CONTACT_PHONE }}
      BETA_CONTACT_EMAIL: ${{ secrets.BETA_CONTACT_EMAIL }}
      BETA_REVIEW_USERNAME: ${{ secrets.BETA_REVIEW_USERNAME }}
      BETA_REVIEW_PASSWORD: ${{ secrets.BETA_REVIEW_PASSWORD }}
      BETA_REVIEW_RECOVERY_KEY: ${{ secrets.BETA_REVIEW_RECOVERY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the token library
        run: python3 -m pip install --quiet "PyJWT[crypto]==2.10.1"

      - name: Put the build in the public beta
        run: python3 Artise/Scripts/testflight_beta.py
