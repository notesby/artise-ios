#
# Artise's additions to the XcodeGen project, included last from project.yml.
# XcodeGen merges includes additively: lists are appended and settings replace upstream's.
# Paths are relative to the repository root (the include uses relativePaths: false).

packages:
  Artise:
    path: Artise
  # Google Analytics for Firebase, for usage statistics people opt in to. Not FirebaseAnalyticsIdentitySupport:
  # without it there's no advertising ID.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.0.1

targets:
  ElementX:
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ArtiseAppIcon

    sources:
    - path: Artise/Resources/Assets.xcassets
    # Each feature's texts are their own string table (ArtiseNotes.strings…), imported from the Android app.
    - path: Artise/Resources/Notes
    - path: Artise/Resources/Stickers

    dependencies:
    # "Artise sticker" in other apps' share menus.
    - target: ArtiseStickerShare
    - package: Artise
      product: ArtiseCore
    - package: Artise
      product: ArtiseNotes
    - package: Artise
      product: ArtiseStickers
    - package: Artise
      product: ArtiseLinkPreview
    - package: Firebase
      product: FirebaseAnalytics

    # Nothing is collected before consent; no ads, no ad signals, no automatic screen reports.
    info:
      properties:
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_REGISTRATION_WITH_AD_NETWORK_ENABLED: false

    postBuildScripts:
    - name: Artise string overrides
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        "$SRCROOT/Artise/Scripts/apply-string-overrides.sh"
    # Firebase's file, written by the TestFlight job from a secret (never committed); other builds have none and
    # keep analytics off.
    - name: Artise Firebase file
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        source="$SRCROOT/Artise/Resources/Firebase/GoogleService-Info.plist"
        if [ -f "$source" ]; then
          cp "$source" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GoogleService-Info.plist"
        fi

  # AppSettings, compiled into both extensions, reads Artise's configuration.
  NSE:
    dependencies:
    - package: Artise
      product: ArtiseCore

  ShareExtension:
    dependencies:
    - package: Artise
      product: ArtiseCore

  # "Artise sticker" in other apps' share menus: hands one picture to the app, which saves it to the account's
  # stickers (as on Android). It only copies the picture into the app group and opens the app.
  ArtiseStickerShare:
    type: app-extension
    platform: iOS

    sources:
    - path: ArtiseStickerShare/Sources
    - path: ArtiseStickerShare/SupportingFiles/en.lproj
    - path: ArtiseStickerShare/SupportingFiles/es.lproj

    info:
      path: ArtiseStickerShare/SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Artise sticker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).StickerShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1

    entitlements:
      path: ArtiseStickerShare/SupportingFiles/ArtiseStickerShare.entitlements
      properties:
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: ArtiseStickerShare
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.stickershare
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_VERSION: 6.2
        SWIFT_APPROACHABLE_CONCURRENCY: YES
